<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SFZ builder browser smoke test</title>
<!--
  A smoke test for the SFZ builder island.

  Run it with `make smoke`. That target copies this file into html/, serves
  html/ and reads the result with headless Chrome. It needs no device and no
  mod-ui server: the $.ajax below answers each request that the island makes.

  What it proves:
    * the island loads and draws its markup
    * the stylesheet loads and reaches the panel
    * a drag makes a helper that you can see, on the body, outside the panel
    * a drag marks each pad that can take the sample
    * a drop puts the sample on the pad

  One rule for a new check: --virtual-time-budget does not advance a CSS
  transition, so a property that transitions reads as the value that it started
  from. The style element below stops the transitions for that reason. Read a
  computed style only while that element is in the page.
-->
<link rel="stylesheet" href="css/main.css">
<style id="no-transitions">#sfzbuilder-library, #sfzbuilder-library * { transition: none !important; }</style>
<script src="js/lib/jquery-1.9.1.min.js"></script>
<script src="js/lib/jquery-ui-1.10.1.custom.min.js"></script>
</head>
<body>
<div id="wrapper"><div><div>
  <div id="sfzbuilder-library" class="mod-hidden mod-init-hidden"></div>
</div></div></div>
<pre id="out"></pre>

<script>
var CHECKS = [], NOTES = [];
function check(name, ok, detail) {
  CHECKS.push((ok ? 'PASS  ' : 'FAIL  ') + name + (detail === undefined ? '' : '  [' + detail + ']'));
}
function note(){ NOTES.push([].join.call(arguments, ' ')); }

// The accent is a design token (architecture rule 4.5), so the checks below
// read it instead of naming a colour. A probe on the body also proves that the
// token reaches outside the panel, which is what the drag helper needs.
function accentRgb() {
  var probe = document.createElement('div');
  probe.style.cssText = 'position:absolute;left:-9999px;background:var(--sfz-accent)';
  document.body.appendChild(probe);
  var colour = getComputedStyle(probe).backgroundColor;
  probe.parentNode.removeChild(probe);
  return colour;
}
// The same idea for a font token. main.less holds
// `* { font-family: "cooper hewitt", Sans-serif !important }`, which lands on
// every element of the panel one by one and beats a plain declaration, so the
// panel drew in the page font and read nothing from --sfz-mono at all.
function tokenValue(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}
function firstFamily(value) {
  return (value.split(',')[0] || '').trim().replace(/^["']|["']$/g, '').toLowerCase();
}
function accentRgba(alpha) {
  var parts = accentRgb().match(/\d+/g) || [];
  return 'rgba(' + parts.slice(0, 3).join(', ') + ', ' + alpha + ')';
}
// A confirm box stops a headless browser dead, so the page answers its own.
// CONFIRM_ANSWER is what it says and CONFIRM_ASKED is the last question, so a
// check can read both. The panel asks before it drops unsaved pads and before
// it deletes a bank.
var CONFIRM_ANSWER = true, CONFIRM_ASKED = '';
// The bank whose sample list the miniature server answers late. See the race
// check at the end of the test.
var SLOW_BANK = '';
window.confirm = function (message) { CONFIRM_ASKED = message; return CONFIRM_ANSWER; };

window.onerror = function (m, s, l, c, e) { check('no script error', false, m + ' ' + ((e && e.stack) || '')); };
window.addEventListener('unhandledrejection', function (e) {
  check('no rejected promise', false, (e.reason && (e.reason.stack || e.reason.message)) || e.reason);
});

// The server, in miniature.
$.ajax = function (o) {
  var d = $.Deferred(), u = o.url;
  setTimeout(function () {
    if (u.indexOf('/sfzbuilder/banks') === 0) {
      d.resolve({ ok: true, banks: ['Drumkit A', 'Foley'], counts: { 'Drumkit A': 6, 'Foley': 12 } });
    } else if (u.indexOf('/sfzbuilder/bank/rename') === 0) {
      // The server gives back the name that reached the disk, not the one it
      // was sent: a space becomes an underscore.
      d.resolve({ ok: true, name: JSON.parse(o.data).new_name.replace(/ /g, '_') });
    } else if (u.indexOf('/sfzbuilder/bank/delete') === 0) {
      d.resolve({ ok: true, name: JSON.parse(o.data).name });
    } else if (u.indexOf('/sfzbuilder/bank') === 0) {
      d.resolve({ ok: true, base_note: 36, slots: [] });
    } else if (u.indexOf('/sfzbuilder/samples') === 0 && o.data.bank === SLOW_BANK) {
      // The answer for this bank comes back late, after the answer for the
      // bank that was clicked next. It must not reach the panel.
      setTimeout(function () {
        d.resolve({ ok: true, files: [
          { basename: 'STALE.wav', fullname: '/a/STALE.wav', size: 1 }] });
      }, 250);
      return;
    } else if (u.indexOf('/sfzbuilder/samples') === 0) {
      d.resolve({ ok: true, files: [
        { basename: 'Kick_01.wav', fullname: '/a/Kick_01.wav', size: 412000 },
        { basename: 'Snare_Rim.wav', fullname: '/a/Snare_Rim.wav', size: 204000 }] });
    } else {
      d.resolve({ ok: true, files: [] });
    }
  }, 0);
  return d.promise();
};

// The part of the legacy code that the seam needs.
function JqueryClass(name, methods) {
  $.fn[name] = function (m) {
    if (typeof m === 'string' && methods[m]) { return methods[m].apply(this, [].slice.call(arguments, 1)); }
    return methods.init.apply(this, arguments);
  };
}
</script>
<script src="js/window.js"></script>
<script src="js/sfzbuilder.js"></script>
<script>
function fire(el, type, x, y) {
  $(el).trigger($.Event(type, { which: 1, pageX: x, pageY: y, clientX: x, clientY: y }));
}
function finish() {
  document.getElementById('out').textContent =
    'SMOKE_START\n' + CHECKS.join('\n')
    + (NOTES.length ? '\n--\n' + NOTES.join('\n') : '') + '\nSMOKE_END';
}

new WindowManager();
$('#sfzbuilder-library').sfzBuilderBox({ trigger: null });

setTimeout(function () {
  var root = document.getElementById('sfzbuilder-library');
  $(root).window('open');

  setTimeout(function () {
    // Opening the panel asks nothing. There is no bank open yet and thus no
    // work to lose, so any question here is the panel asking about itself.
    check('opening the panel asks no question', CONFIRM_ASKED === '',
          JSON.stringify(CONFIRM_ASKED));

    var link = document.querySelector('link[data-sfzbuilder]');
    check('the island adds its stylesheet', !!link);
    var sheet = link && link.sheet;
    check('the stylesheet loads', !!sheet && sheet.cssRules.length > 0,
          sheet ? sheet.cssRules.length + ' rules' : 'no sheet');

    var cs = getComputedStyle(root);
    check('the panel fills the window', cs.position === 'absolute', cs.position);
    check('the panel has its own ground', cs.backgroundColor === 'rgb(10, 10, 10)', cs.backgroundColor);

    var header = root.querySelector('header');
    check('the shared header bar is there', !!header);
    if (header) {
      var hs = getComputedStyle(header);
      check('the header does not draw the MOD icon', hs.backgroundImage === 'none', hs.backgroundImage);
      check('the header is 45px high', hs.height === '45px', hs.height);
    }

    check('the bank list has the banks', root.querySelectorAll('.sfz-bank').length === 2);
    check('the sample list has the samples', root.querySelectorAll('.sfz-sample').length === 2);

    var bank = root.querySelector('.sfz-bank');
    if (bank) { bank.click(); }

    setTimeout(function () {
      var pads = root.querySelectorAll('.sfz-pad');
      check('the pads are drawn', pads.length === 8, pads.length + ' pads');

      var row = root.querySelector('.sfz-sample');
      var pad = pads[1];
      if (!row || !pad) { check('a row and a pad to drag between', false); finish(); return; }

      var rr = row.getBoundingClientRect(), pr = pad.getBoundingClientRect();
      fire(row, 'mousedown', rr.left + 10, rr.top + 8);
      fire(document, 'mousemove', rr.left + 30, rr.top + 30);
      fire(document, 'mousemove', pr.left + pr.width / 2, pr.top + pr.height / 2);

      // The helper must be one that you can see. It goes on the body, where the
      // tokens of the panel do not reach, so a var() without a value there made
      // it black text on nothing.
      var helper = document.querySelector('.sfz-drag-helper');
      check('a drag makes a helper', !!helper);
      if (helper) {
        var hs2 = getComputedStyle(helper);
        var box = helper.getBoundingClientRect();
        check('the helper is on the body', helper.parentNode.tagName === 'BODY', helper.parentNode.tagName);
        check('the accent token resolves on the body',
              /^rgb\(/.test(accentRgb()), accentRgb());
        check('the helper has a ground you can see',
              hs2.backgroundColor === accentRgb(), hs2.backgroundColor);
        check('the helper has a size you can see', box.width > 60 && box.height > 20,
              Math.round(box.width) + 'x' + Math.round(box.height));
        check('the helper names the sample', helper.textContent.indexOf('Kick_01.wav') >= 0,
              JSON.stringify(helper.textContent));
      }

      check('the row you drag from is marked', row.classList.contains('sfz-sample--dragging'));
      check('every pad says it can take the sample',
            root.querySelectorAll('.sfz-pad--target').length === 8,
            root.querySelectorAll('.sfz-pad--target').length + ' marked');
      check('the pad under the pointer is marked',
            root.querySelectorAll('.sfz-pad--drop').length === 1);

      var target = root.querySelector('.sfz-pad--target');
      if (target) {
        var ts = getComputedStyle(target);
        check('a pad that can take the sample is drawn in the accent',
              ts.borderTopColor === accentRgba('0.55'), ts.borderTopColor);
      }

      fire(document, 'mouseup', pr.left + pr.width / 2, pr.top + pr.height / 2);
      setTimeout(function () {
        check('the drop puts the sample on the pad',
              root.querySelectorAll('.sfz-pad--filled').length === 1);
        check('the helper goes away', !document.querySelector('.sfz-drag-helper'));
        // Unsaved work. The drop above put a sample on a pad, which is a
        // change the sidecar keeps, so the panel has to say so.
        var mark = root.querySelector('.sfz-dirty');
        check('the panel says the pads hold an unsaved change', mark && !mark.hidden);

        // A gain, a root note or a loop mode is a change too, and none of the
        // three draws the pads again: the focus has to stay in the box you are
        // typing in.
        var padStep = root.querySelector('.sfz-pad--filled .sfz-step--mini input');
        if (padStep) {
          padStep.focus();
          padStep.value = '-6';
          padStep.dispatchEvent(new Event('change', { bubbles: true }));
          check('an edit inside a pad keeps the focus where it was',
                document.activeElement === padStep);
        }

        // A bank that is not the open one asks before it drops the work.
        CONFIRM_ANSWER = false;
        CONFIRM_ASKED = '';
        var other = root.querySelectorAll('.sfz-bank')[1];
        other.click();
        check('another bank asks before it drops the work',
              CONFIRM_ASKED.indexOf('unsaved modifications') > 0, JSON.stringify(CONFIRM_ASKED));
        check('a refused confirm keeps the bank that is open',
              root.querySelector('.sfz-title').textContent === 'Drumkit A',
              root.querySelector('.sfz-title').textContent);
        check('a refused confirm leaves the selection where it was',
              root.querySelectorAll('.sfz-bank')[0].classList.contains('sfz-bank--on'));
        CONFIRM_ANSWER = true;

        // The note stepper must keep one width. Its content goes from four to
        // seven characters, so a box that sizes to its content moves the minus
        // and the plus under the pointer while you step through the notes.
        // These are the widest and the narrowest values, and the field that a
        // click opens, which was a third width of its own.
        var tokenbox = root.querySelector('.sfz-step .sfz-tokenbox');
        check('the note stepper is there', !!tokenbox);
        if (tokenbox) {
          var widths = {};
          var record = function (name) { widths[name] = tokenbox.offsetWidth; };
          var setNote = function (value) {
            tokenbox.dispatchEvent(new MouseEvent('click', { bubbles: true }));
            var edit = tokenbox.querySelector('input.sfz-token-edit');
            if (!edit) { return null; }
            record('editing');
            edit.value = String(value);
            edit.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
            return edit;
          };
          record('36 C2');
          check('a click opens the field that takes a number', !!setNote(127));
          record('127 G9');
          setNote(10);
          record('10 A#-1');
          setNote(0);
          record('0 C-1');
          var seen = Object.keys(widths).map(function (k) { return widths[k]; });
          var same = seen.every(function (w) { return w === seen[0] && w > 0; });
          check('the note stepper keeps one width', same,
                Object.keys(widths).map(function (k) {
                  return k + '=' + widths[k] + 'px';
                }).join(' '));
          setNote(36);
        }

        // The panel draws in its own font. The title is checked because that
        // is where the wrong font showed first, and .sfz-lbl because a nested
        // element is what the `*` rule of main.less reaches: the panel had the
        // right family on itself and the page font on everything inside it.
        var wantMono = firstFamily(tokenValue('--sfz-mono'));
        var titleFamily = firstFamily(getComputedStyle(root.querySelector('.sfz-title')).fontFamily);
        var lblFamily = firstFamily(getComputedStyle(root.querySelector('.sfz-lbl')).fontFamily);
        check('the title draws in the font of the panel', titleFamily === wantMono,
              titleFamily + ' vs ' + wantMono);
        check('an element inside the panel draws in the font of the panel',
              lblFamily === wantMono, lblFamily + ' vs ' + wantMono);

        // The head holds no empty row. The tool row is hidden while no bank is
        // open, so the space under the title row has to come from a gap, which
        // is drawn between two visible rows, and never from a margin, which is
        // drawn whether or not a row follows.
        var headStyle = getComputedStyle(root.querySelector('.sfz-head'));
        var topStyle = getComputedStyle(root.querySelector('.sfz-head-top'));
        check('the head spaces its rows with a gap', headStyle.display === 'flex' &&
              parseFloat(headStyle.rowGap) > 0, headStyle.display + ' gap=' + headStyle.rowGap);
        check('the title row carries no margin under it',
              parseFloat(topStyle.marginBottom) === 0, topStyle.marginBottom);
        check('the status sits on the title row, which is never hidden',
              root.querySelector('.sfz-head-top > .sfz-status') !== null);

        // The focus ring. main.less has `* { outline: 0 !important }`, so the
        // panel has to put a ring back with a rule of its own. These checks say
        // that it does, and that each control the mouse can reach the keyboard
        // can reach as well: a div with an onclick and no tabindex takes no
        // focus and thus can carry no ring.
        var reach = [
          ['the new bank button', '.sfz-add'],
          ['the save button', '.sfz-save'],
          ['the rename button', '.sfz-btn--quiet'],
          ['the delete button', '.sfz-btn--danger'],
          ['a source button', '.sfz-seg button'],
          ['the upload control', '.sfz-upload input'],
          ['the filter box', '.sfz-search'],
          ['a stepper button', '.sfz-step button'],
          ['a stepper box', '.sfz-step input'],
          ['the note stepper value', '.sfz-tokenbox'],
          ['a bank row', '.sfz-bank'],
          ['a sample row', '.sfz-sample'],
          ['a sample play button', '.sfz-sample-play'],
          ['a pad', '.sfz-pad']
        ];
        var unreachable = [];
        var unringed = [];
        reach.forEach(function (entry) {
          var node = root.querySelector(entry[1]);
          if (!node) { unreachable.push(entry[0] + ' (absent)'); return; }
          node.focus();
          if (document.activeElement !== node) { unreachable.push(entry[0]); return; }
          // The ring is on :focus-visible. focus() from script counts as
          // keyboard focus in Chrome, so the computed outline is the real one.
          // The label wears the ring for the file input it hides.
          var ringed = node.matches('.sfz-upload input') ? node.closest('.sfz-upload') : node;
          var os = getComputedStyle(ringed);
          if (parseFloat(os.outlineWidth) < 1 || os.outlineStyle === 'none') {
            unringed.push(entry[0] + '=' + os.outlineStyle + ' ' + os.outlineWidth);
          }
        });
        check('every control the mouse reaches the keyboard reaches',
              unreachable.length === 0, unreachable.join(', ') || 'all ' + reach.length);
        check('every control that has the focus shows a ring',
              unringed.length === 0, unringed.join(', ') || 'all ' + reach.length);

        // A tap must not leave a ring behind on the touch screen, which is what
        // the :focus-visible guard is for. The behaviour cannot be driven from
        // here: the browser decides :focus-visible from the last real input,
        // and an event that a script sends is not one. So this check asks that
        // the rule is present, and it is the rule going missing that the check
        // is meant to catch.
        var guard = false;
        for (var r = 0; sheet && r < sheet.cssRules.length; r++) {
          if ((sheet.cssRules[r].selectorText || '').indexOf(':focus:not(:focus-visible)') >= 0) {
            guard = true;
          }
        }
        check('a press leaves no ring behind', guard,
              guard ? ':focus-visible guard present' : 'guard rule is gone');
        root.querySelector('.sfz-pad').blur();

        // The tab order is the order of the document, whatever the pad count.
        // Nothing carries a positive tabindex, which would pull an element out
        // of that order and put it in front of the whole page; every control is
        // simply reached in the order it is drawn. This is checked at a pad
        // count well above the default, because the pads and the controls they
        // hold are what make the order long.
        var padBox = root.querySelectorAll('.sfz-tools .sfz-step input')[0];
        check('the pad count control is there', !!padBox);
        if (padBox) {
          padBox.value = '24';
          padBox.dispatchEvent(new Event('change', { bubbles: true }));
          check('the pad count follows the control',
                root.querySelectorAll('.sfz-pad').length === 24,
                root.querySelectorAll('.sfz-pad').length + ' pads');

          var focusables = root.querySelectorAll(
            'a[href], button, input, select, textarea, [tabindex]');
          var positive = [], skipped = [];
          for (var f = 0; f < focusables.length; f++) {
            var node = focusables[f];
            var attr = node.getAttribute('tabindex');
            if (attr !== null && parseInt(attr, 10) > 0) { positive.push(node.className); }
            if (attr !== null && parseInt(attr, 10) < 0) { skipped.push(node.className); }
          }
          check('nothing pulls itself out of the document order',
                positive.length === 0, positive.join(', ') || 'no positive tabindex');
          check('nothing takes itself out of the tab order',
                skipped.length === 0, skipped.join(', ') || 'no negative tabindex');

          // Every stop between one pad and the next belongs to that pad. This
          // is what "the order of the document" means here: you reach a pad,
          // then the controls it holds, then the pad after it. An empty pad
          // holds none and is followed at once by the next, which is correct.
          var pads = root.querySelectorAll('.sfz-pad');
          // Only the stops inside the grid, so the last pad ends at the end of
          // the grid and not at the end of the panel.
          var grid = root.querySelector('.sfz-grid');
          var list = [].filter.call(focusables, function (n) { return grid.contains(n); });
          var strays = [], inner = {};
          for (var i = 0; i < pads.length; i++) {
            var from = list.indexOf(pads[i]);
            var to = i + 1 < pads.length ? list.indexOf(pads[i + 1]) : list.length;
            inner[i] = to - from - 1;
            for (var j = from + 1; j < to; j++) {
              if (!pads[i].contains(list[j])) { strays.push(i + ':' + list[j].className); }
            }
          }
          check('every stop between two pads belongs to the pad before it',
                strays.length === 0, strays.join(', ') || pads.length + ' pads walked');

          // A pad that holds a sample adds its own controls to the order: the
          // clear and play buttons, the gain and root steppers, the loop menu.
          var filled = root.querySelector('.sfz-pad--filled');
          var at = [].indexOf.call(pads, filled);
          check('a pad that holds a sample puts its controls in the order',
                filled && inner[at] >= 8, filled ? inner[at] + ' stops inside' : 'no filled pad');

          padBox.value = '8';
          padBox.dispatchEvent(new Event('change', { bubbles: true }));
        }

        // The panel must not leak a jQuery UI widget when it draws again.
        //
        // jQuery UI keeps a droppable in $.ui.ddmanager and a draggable in the
        // jQuery data cache, and takes either one out only through the cleanData
        // hook of jQuery. A native removeChild never runs that hook, so a draw
        // that removes the elements natively leaves the entries behind. They
        // hold the element, so it is never collected, and jQuery UI walks the
        // whole list of droppables on every move of a drag.
        //
        // The pads are drawn again on each change of the pad count, and the
        // sample rows on each keystroke of the filter.
        function droppableCount() {
          var all = $.ui && $.ui.ddmanager && $.ui.ddmanager.droppables;
          var n = 0;
          for (var scope in all) { n += all[scope].length; }
          return n;
        }
        function dataCount() { return Object.keys($.cache || {}).length; }

        var search = root.querySelector('.sfz-search');
        function redraw(times) {
          for (var t = 0; t < times; t++) {
            padBox.value = String(8 + (t % 2) * 4);
            padBox.dispatchEvent(new Event('change', { bubbles: true }));
            search.value = t % 2 ? 'a' : '';
            search.dispatchEvent(new Event('input', { bubbles: true }));
          }
        }

        redraw(2);
        var dropBefore = droppableCount(), dataBefore = dataCount();
        redraw(8);
        var dropAfter = droppableCount(), dataAfter = dataCount();
        check('a redraw leaks no droppable', dropAfter <= dropBefore,
              dropBefore + ' -> ' + dropAfter);
        check('a redraw leaks no jQuery data', dataAfter <= dataBefore,
              dataBefore + ' -> ' + dataAfter);
        padBox.value = '8';
        padBox.dispatchEvent(new Event('change', { bubbles: true }));
        search.value = '';
        search.dispatchEvent(new Event('input', { bubbles: true }));

        // No control may sit inside a role that flattens its children. The
        // children of a button, an option, a tab and the rest below are
        // presentational: a screen reader is free to read the element as one
        // piece of text and drop what is inside it. A pad holds nine controls
        // and a sample row holds a play button, so neither can wear one.
        var FLATTENS = ['button', 'option', 'tab', 'menuitem',
                        'menuitemcheckbox', 'menuitemradio',
                        'checkbox', 'radio', 'switch', 'progressbar', 'slider'];
        var swallowed = [];
        var roled = root.querySelectorAll('[role]');
        for (var k = 0; k < roled.length; k++) {
          if (FLATTENS.indexOf(roled[k].getAttribute('role')) < 0) { continue; }
          var held = roled[k].querySelectorAll(
            'a[href], button, input, select, textarea, [tabindex]');
          if (held.length > 0) {
            swallowed.push(roled[k].getAttribute('role') + '.' +
                           (roled[k].className || roled[k].tagName) +
                           ' holds ' + held.length);
          }
        }
        check('no control sits inside a role that drops its children',
              swallowed.length === 0,
              swallowed.join(', ') || roled.length + ' roles checked');

        // Rename and delete. The confirm box is answered by the stub below,
        // because a headless browser answers it with false and the delete
        // would never run.
        var bankNames = function () {
          return [].map.call(root.querySelectorAll('.sfz-bank-name'), function (n) {
            return n.textContent;
          });
        };
        // A save writes what the pads hold, so the mark goes.
        root.querySelector('.sfz-save').click();

        check('the panel lists the banks it was given',
              bankNames().join() === 'Drumkit A,Foley', bankNames().join());

        setTimeout(function () {
        check('a save takes the unsaved mark away',
              root.querySelector('.sfz-dirty').hidden);

        var renameButton = root.querySelector('.sfz-btn--quiet');
        renameButton.click();
        var titleEdit = root.querySelector('.sfz-title-edit');
        check('rename opens a field where the title is', !!titleEdit);
        if (titleEdit) {
          check('the field starts at the name of the bank',
                titleEdit.value === 'Drumkit A', titleEdit.value);
          check('the title steps aside while the field is open',
                root.querySelector('.sfz-title').hidden);
          check('the field has the focus', document.activeElement === titleEdit);

          // Escape gives the name back and the focus with it.
          titleEdit.value = 'Something else';
          titleEdit.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
          check('escape puts the title back', !root.querySelector('.sfz-title-edit') &&
                root.querySelector('.sfz-title').textContent === 'Drumkit A' &&
                !root.querySelector('.sfz-title').hidden);
          check('escape gives the focus back to the button',
                document.activeElement === renameButton);
        }

        renameButton.click();
        var edit2 = root.querySelector('.sfz-title-edit');
        edit2.value = 'Kit A';
        edit2.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter', bubbles: true }));
        setTimeout(function () {
          // The panel opens the name the server gives back, not the one it
          // sent: "Kit A" reached the disk as "Kit_A".
          check('a rename opens the name the server gives back',
                root.querySelector('.sfz-title').textContent === 'Kit_A',
                root.querySelector('.sfz-title').textContent);

          CONFIRM_ANSWER = false;
          CONFIRM_ASKED = '';
          root.querySelector('.sfz-btn--danger').click();
          check('delete asks before it removes anything',
                CONFIRM_ASKED.indexOf('cannot be undone') > 0, JSON.stringify(CONFIRM_ASKED));
          check('a refused confirm removes nothing',
                root.querySelector('.sfz-title').textContent === 'Kit_A');
          CONFIRM_ANSWER = true;

          // A slow answer for a bank you left must not draw over the bank
          // you are on. Click the slow bank, then the next one, and wait past
          // the slow answer.
          SLOW_BANK = 'Drumkit A';
          var rows = root.querySelectorAll('.sfz-bank');
          rows[0].click();
          rows[1].click();
          setTimeout(function () {
            var names = [].map.call(root.querySelectorAll('.sfz-sample-name'),
                                    function (n) { return n.textContent; });
            check('the open bank is the one that was clicked last',
                  root.querySelector('.sfz-title').textContent === 'Foley',
                  root.querySelector('.sfz-title').textContent);
            check('a late answer for a bank you left is dropped',
                  names.indexOf('STALE.wav') < 0, names.join());
            SLOW_BANK = '';

            var panel = root.querySelector('.sfz-panel');
            note('panel columns:', getComputedStyle(panel).gridTemplateColumns);
            note('colour scheme:', getComputedStyle(root).colorScheme);
            finish();
          }, 500);
        }, 200);
        }, 200);
      }, 200);
    }, 400);
  }, 700);
}, 300);
</script>
</body></html>
